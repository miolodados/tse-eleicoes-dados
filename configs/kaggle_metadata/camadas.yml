# Descrição das camadas analíticas (Medallion Architecture) em pt-BR

camadas:
  bronze:
    nome: "Camada Bronze (Ingestão Fiel & Higienizada)"
    proposito: >
      Espelha com fidelidade as fontes oficiais do Portal de Dados Abertos do TSE,
      convertidas para formato Apache Parquet colunar de alta compressão (ZSTD nível 5).
      Aplica estrita redação de PII (anonimização de MAC address e sequências numéricas
      sensíveis) conforme salvaguardas de conformidade LGPD.
    particionamento: "Hive padrão (election_year=YYYY/turn=T/uf=UF) quando aplicável."
    formato: "Apache Parquet comprimido com Zstandard (ZSTD) nível 5."

  silver:
    nome: "Camada Silver (Conformada, Enriquecida & Semântica)"
    proposito: >
      Aplica regras de negócio determinísticas sobre a Bronze:
      1) Parse semântico v1.1.0, remoção determinística de carryover do 1º turno em
      partições do 2º turno (imune a clock drift de BIOS) e categorização dos logs da
      urna eletrônica em eventos canônicos (fact_urna_event);
      2) Reconstrução de sessões eleitorais via máquina de estados v1.0.0 (fact_voting_session);
      3) Dimensões conformadas consolidadas (dim_election, dim_cargo, dim_partido).
    garantias:
      - "Zero PII garantido por catálogo semântico estrito."
      - "Integridade referencial (0,00% órfãos) e unicidade de chaves primárias validadas."
      - "Controle de versão de parsers e máquinas de estado em cada registro."
      - "Preservação de registros com clock drift da BIOS sinalizados por is_clock_drift."

  gold:
    nome: "Camada Gold (Agregações Analíticas de Negócio)"
    proposito: >
      Tabelas analíticas pré-computadas otimizadas para consumo direto em sub-100ms por
      DuckDB, Polars, aplicações analíticas (como o TS-Zé) e pesquisadores eleitorais,
      sem necessidade de reprocessar bilhões de linhas brutas.
    tabelas_principais:
      - "gold_event_distribution: Frequência, proporção e contagem de clock drift de cada evento por UF e turno."
      - "gold_session_completeness: Taxa de sessões fechadas, contingências e estatísticas de ciclos de eleitores."
      - "gold_biometric_attempts: Contagem e distribuição acumulada de tentativas biométricas."
      - "gold_section_turn_summary: Fato analítico central no grão seção × turno (~998 mil linhas) unindo métricas operacionais/biométricas da urna com comparecimento oficial do BU, perfil do eleitorado, local de votação, modelo da urna e correspondência efetivada."
      - "gold_municipality_turn_summary: Consolidação analítica no grão município × turno (~11 mil linhas) para mapas, rankings e análises regionais instantâneas."
