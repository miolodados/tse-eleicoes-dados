# Glossário de prefixos e descrições padrão para colunas do TSE em pt-BR

prefixos:
  AA_: "Ano de referência do registro eleitoral"
  ANO_: "Ano de referência da eleição ou registro"
  CD_: "Código numérico identificador oficial"
  DS_: "Descrição textual oficial da entidade ou situação"
  DT_: "Data de ocorrência ou de geração do dado"
  HH_: "Horário de ocorrência ou de geração do dado"
  NM_: "Nome textual oficial"
  NR_: "Número identificador (candidato, zona, seção, etc.)"
  QT_: "Quantidade apurada ou calculada"
  SG_: "Sigla da unidade federativa, partido ou entidade"
  SQ_: "Sequencial numérico gerado pelo TSE"
  ST_: "Situação ou indicador de estado (S/N ou texto)"
  TP_: "Tipo de dado, classificação ou registro"
  VR_: "Valor financeiro ou monetário apurado"

colunas_recorrentes:
  ANO_ELEICAO: "Ano da eleição oficial (ex.: 2022, 2026)"
  NR_TURNO: "Número do turno da eleição (1 para 1º turno, 2 para 2º turno)"
  SG_UF: "Sigla da Unidade Federativa brasileira ou ZZ para exterior"
  CD_MUNICIPIO: "Código numérico do município segundo o cadastro do TSE"
  NM_MUNICIPIO: "Nome oficial do município brasileiro ou cidade no exterior"
  NR_ZONA: "Número da zona eleitoral"
  NR_SECAO: "Número da seção eleitoral"
  CD_CARGO: "Código oficial do cargo eletivo em disputa"
  DS_CARGO: "Descrição oficial do cargo eletivo (ex.: Presidente, Governador)"
  CD_CARGO_PERGUNTA: "Código do cargo ou da pergunta de consulta popular"
  DS_CARGO_PERGUNTA: "Descrição do cargo ou pergunta eleitoral"
  NR_VOTAVEL: "Número do candidato, legenda partidária ou voto em branco/nulo"
  NM_VOTAVEL: "Nome do candidato, partido político ou opção de voto"
  QT_VOTOS: "Quantidade total de votos apurados"
  NR_PARTIDO: "Número da agremiação partidária registrada no TSE"
  SG_PARTIDO: "Sigla oficial da legenda partidária"
  NM_PARTIDO: "Nome oficial da legenda partidária"
  SQ_CANDIDATO: "Número sequencial gerado pelo TSE para identificação única do candidato"
  NM_CANDIDATO: "Nome completo do candidato registrado"
  NM_URNA_CANDIDATO: "Nome do candidato para exibição na tela da urna eletrônica"
  DT_GERACAO: "Data em que o arquivo foi consolidado e gerado pelo TSE"
  HH_GERACAO: "Horário em que o arquivo foi gerado pelo TSE"
  QT_APTOS: "Quantidade total de eleitores aptos a votar na seção"
  QT_COMPARECIMENTO: "Quantidade total de eleitores que compareceram à votação"
  QT_ABSTENCAO: "Quantidade total de eleitores que se abstiveram da votação"

camadas_padrao:
  election_year: "Ano eleitoral da partição (chave de partição Hive)"
  turn: "Turno da eleição (1 ou 2; chave de partição Hive)"
  uf: "Sigla da Unidade Federativa da partição (chave de partição Hive)"
  municipio_code: "Código TSE do município"
  zone_num: "Número da zona eleitoral"
  section_num: "Número da seção eleitoral"
  urna_serial: "Número de série da urna eletrônica"
  raw_timestamp: "Timestamp com precisão de microssegundos registrado pelo sistema operacional da urna"
  file_seq: "Sequencial do evento dentro do arquivo de log da urna"
  event_code: "Código canônico do evento classificado segundo o catálogo de eventos"
  log_level: "Nível de severidade do log (ex.: INFO, WARN, ERROR)"
  application: "Módulo ou subsistema do software da urna que emitiu o log"
  classification_status: "Status de classificação do evento (CLASSIFIED ou UNKNOWN)"
  parser_version: "Versão do analisador semântico de logs da urna"
  final_state: "Estado de encerramento da sessão de votação (CLOSED ou INCOMPLETE)"
  is_complete: "Booleano indicando se a sessão registrou fechamento formal"
  has_contingency: "Booleano indicando ocorrência de evento de contingência"
  voter_cycles: "Contagem de ciclos completos de eleitores com voto computado"
  event_count: "Contagem total de eventos registrados na sessão"
  state_machine_version: "Versão da máquina de estados determinística"
